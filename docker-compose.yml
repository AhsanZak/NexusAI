services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexusai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  openfga:
    image: openfga/openfga:v1.23.0
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      # The Playground page tells the browser to call this listen port.
      # Host 8080 is the dashboard, so the API is published on the same port it listens on.
      OPENFGA_HTTP_ADDR: 0.0.0.0:8090
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_HTTP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://play.fga.dev
      OPENFGA_HTTP_CORS_ALLOWED_HEADERS: "*"
    ports:
      - "8090:8090"
      - "3000:3000"

  backend:
    build:
      context: ./backend
    environment:
      NEXUS_ENVIRONMENT: ${NEXUS_ENVIRONMENT:-local}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:-postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      NEXUS_CHAT_ALIAS: ${NEXUS_CHAT_ALIAS:-ollama-qwen3-vl}
      NEXUS_CHAT_MODEL: ${NEXUS_CHAT_MODEL:-ollama/qwen3-vl:32b-instruct}
      NEXUS_CHAT_API_BASE: ${NEXUS_CHAT_API_BASE:-http://192.168.100.11:11434}
      NEXUS_OLLAMA_BASE_URL: ${NEXUS_OLLAMA_BASE_URL:-http://192.168.100.11:11434}
      NEXUS_OLLAMA_CHAT_MODEL: ${NEXUS_OLLAMA_CHAT_MODEL:-qwen3-vl:32b-instruct}
      NEXUS_OLLAMA_EMBED_MODEL: ${NEXUS_OLLAMA_EMBED_MODEL:-bge-m3:latest}
      NEXUS_LLM_TIMEOUT_SECONDS: ${NEXUS_LLM_TIMEOUT_SECONDS:-180}
      NEXUS_LLM_MAX_RETRIES: ${NEXUS_LLM_MAX_RETRIES:-2}
      NEXUS_TRACE_DATABASE_URL: ${NEXUS_TRACE_DATABASE_URL:-postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXUS_OPENFGA_API_URL: ${NEXUS_OPENFGA_API_URL:-http://openfga:8090}
      NEXUS_OPENFGA_STORE_NAME: ${NEXUS_OPENFGA_STORE_NAME:-nexusai}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
