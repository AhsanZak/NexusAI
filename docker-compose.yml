services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexusai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  openfga:
    image: openfga/openfga:v1.23.0
    command: ["run", "--datastore-engine", "memory", "--http-addr", "0.0.0.0:8080"]
    ports:
      - "8090:8080"

  backend:
    build:
      context: ./backend
    environment:
      NEXUS_ENVIRONMENT: ${NEXUS_ENVIRONMENT:-local}
      NEXUS_LOG_LEVEL: ${NEXUS_LOG_LEVEL:-INFO}
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:-postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      NEXUS_CHAT_ALIAS: ${NEXUS_CHAT_ALIAS:-chat-default}
      NEXUS_CHAT_MODEL: ${NEXUS_CHAT_MODEL:-openai/gpt-4o-mini}
      NEXUS_LLM_TIMEOUT_SECONDS: ${NEXUS_LLM_TIMEOUT_SECONDS:-60}
      NEXUS_LLM_MAX_RETRIES: ${NEXUS_LLM_MAX_RETRIES:-2}
      NEXUS_TRACE_DATABASE_URL: ${NEXUS_TRACE_DATABASE_URL:-postgresql+asyncpg://nexus:nexus@postgres:5432/nexusai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXUS_OPENFGA_API_URL: ${NEXUS_OPENFGA_API_URL:-http://openfga:8080}
      NEXUS_OPENFGA_STORE_NAME: ${NEXUS_OPENFGA_STORE_NAME:-nexusai}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
